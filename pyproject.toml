[project]
name = "minas-webdav"
version = "0.1.0"
description = "Xiaomi Smart Storage (MINAS) WebDAV control toolkit: CLI, probe, local proxy"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
minas-webdav = "minas_webdav.cli:main"
minas-webdav-proxy = "minas_webdav.proxy:run"
minas-webdav-probe = "minas_webdav.probe:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minas_webdav"]

[tool.setuptools.package-data]
minas_webdav = ["minas_config.example.json"]
